{% extends "base.html" %}

{% block title %}
Dashboard
{% endblock %}

{% block content %}

<div class="container mt-5">

    <h2 class="mb-4">

        Welcome, {{ request.user.username }}

    </h2>

    <div class="row">

        <div class="col-md-4 mb-4">

            <div class="card text-center shadow">

                <div class="card-body">

                    <h1>

                        ❤️

                    </h1>

                    <h3>

                        {{ favorite_count }}

                    </h3>

                    <p>

                        Favorite Words

                    </p>

                    <a
                        href="{% url 'dictionary:my_favorites' %}"
                        class="btn btn-success">

                        View

                    </a>

                </div>

            </div>

        </div>

        <div class="col-md-4 mb-4">

            <div class="card text-center shadow">

                <div class="card-body">

                    <h1>

                        📖

                    </h1>

                    <h3>

                        {{ contribution_count }}

                    </h3>

                    <p>

                        Contributions

                    </p>

                    <a
                        href="{% url 'dictionary:my_contributions' %}"
                        class="btn btn-success">

                        View

                    </a>

                </div>

            </div>

        </div>

        <div class="col-md-4 mb-4">

            <div class="card text-center shadow">

                <div class="card-body">

                    <h1>

                        ⭐️

                    </h1>

                    <h3>

                        {{ rating_count }}

                    </h3>

                    <p>

                        Ratings

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
