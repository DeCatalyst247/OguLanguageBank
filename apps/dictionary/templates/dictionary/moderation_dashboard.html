{% extends "base.html" %}

{% block title %}

Moderation Dashboard

{% endblock %}

{% block content %}

<div class="container mt-5">

<h2 class="mb-4">

Editorial Dashboard

</h2>

<div class="row">

<div class="col-md-3">

<div class="card text-center">

<div class="card-body">

<h3>{{ stats.total }}</h3>

<p>Total</p>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card bg-warning text-dark text-center">

<div class="card-body">

<h3>{{ pending }}</h3>

<p>Pending</p>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card bg-success text-white text-center">

<div class="card-body">

<h3>{{ approved }}</h3>

<p>Approved</p>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card bg-danger text-white text-center">

<div class="card-body">

<h3>{{ rejected }}</h3>

<p>Rejected</p>

</div>

</div>

</div>

</div>

</div>

{% endblock %}
